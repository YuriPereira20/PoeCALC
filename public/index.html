<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f3d48b'/%3E%3Cstop offset='.5' stop-color='%23e2b566'/%3E%3Cstop offset='1' stop-color='%23c8753a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%230b0a0f'/%3E%3Cpath d='M16 3 29 16 16 29 3 16Z' fill='none' stroke='url(%23g)' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M16 8.5 23.5 16 16 23.5 8.5 16Z' fill='url(%23g)'/%3E%3Cpath d='M12 17.5 16 13.5 20 17.5' fill='none' stroke='%230b0a0f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>PoeCALC · Lucros de Path of Exile</title>
<style>
  :root {
    --bg:#0b0a0f; --panel:#141219; --panel2:#1c1924; --line:#2b2736; --line2:#3d3750;
    --text:#ece7dd; --muted:#948da3;
    --accent:#e2b566; --accent-soft:rgba(226,181,102,.13);
    --grad:linear-gradient(135deg,#f3d48b 0%,#e2b566 45%,#c8753a 100%);
    --pos:#5fd39a; --pos-soft:rgba(95,211,154,.13);
    --neg:#ff6b78; --neg-soft:rgba(255,107,120,.13);
    --warn:#f0b354; --warn-soft:rgba(240,179,84,.13);
    --info:#a892ff; --info-soft:rgba(168,146,255,.14);
    --r:12px;
    --display:"Cinzel",Georgia,"Times New Roman",serif;
    --shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 28px -16px rgba(0,0,0,.7);
    color-scheme: dark;
  }
  *{box-sizing:border-box;scrollbar-color:var(--line) transparent}
  ::selection{background:rgba(226,181,102,.35)}
  [hidden]{display:none!important}
  body{margin:0;font:14px/1.5 "Inter",system-ui,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(900px 520px at 0% 0%,rgba(200,117,58,.11),transparent 62%),radial-gradient(820px 600px at 100% 0%,rgba(168,146,255,.07),transparent 62%),var(--bg);background-attachment:fixed;color:var(--text);display:flex;min-height:100vh}
  a{color:var(--info)}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  h2{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.4px;line-height:1.2;margin:0 0 14px}
  h2::after{content:"";display:block;width:56px;height:3px;margin-top:10px;border-radius:999px;background:var(--grad)}
  .hd h2::after{display:none}
  h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.4px;color:var(--text);margin:26px 0 8px}
  h3::before{content:"";display:inline-block;width:7px;height:7px;margin-right:9px;transform:rotate(45deg);background:var(--grad);vertical-align:1px}
  aside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;width:264px;flex:none;display:flex;flex-direction:column;padding:16px 12px;background:linear-gradient(180deg,#17141d 0%,var(--panel) 240px);border-right:1px solid var(--line)}
  main{flex:1;min-width:0;padding:24px 28px 48px}
  .brand{display:flex;align-items:center;gap:11px;margin:4px 8px 14px;font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:1.2px;line-height:1.1;color:var(--text);text-decoration:none}
  .brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{display:block;margin-top:4px;font:500 10px/1.2 "Inter",system-ui,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
  .brand .mark{width:34px;height:34px;flex:none;filter:drop-shadow(0 0 10px rgba(226,181,102,.35))}
  aside h4{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:18px 10px 6px}
  aside h4::after{content:"";flex:1;height:1px;background:var(--line)}
  nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--text);text-decoration:none;transition:background .15s,color .15s}
  nav a:hover{background:var(--panel2)}
  nav a.on{background:linear-gradient(90deg,var(--accent-soft),transparent);color:var(--accent);box-shadow:inset 3px 0 var(--accent);font-weight:600}
  .cnt{font-size:11px;color:var(--muted);background:var(--panel2);padding:1px 7px;border-radius:999px}
  /* above the nav: with 14 calculators the bottom of the sidebar is off screen */
  .side-ctl{margin-top:14px;padding:0 10px 14px;border-bottom:1px solid var(--line)}
  aside label{display:block;margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
  aside label select{display:block;width:100%;margin-top:4px;font-size:14px;letter-spacing:0;text-transform:none;color:var(--text)}
  #atualizar{width:100%}
  #info{margin:10px 0 0;font-size:12px}
  input:not([type=checkbox]),select,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;transition:border-color .15s,filter .15s}
  input:not([type=checkbox]):hover,select:hover,button:hover{border-color:var(--line2)}
  input[type=checkbox]{accent-color:var(--accent)}
  button{cursor:pointer}
  button.primary{background:var(--grad);color:#17110a;font-weight:700;border-color:transparent;box-shadow:0 6px 18px -8px rgba(226,181,102,.6)}
  button.primary:hover:not(:disabled){filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:default}
  .ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
  .ctl label{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--muted)}
  #q,#xq{width:240px;max-width:100%}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 16px}
  .stat,.pod{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
  .stat{position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--grad);opacity:.55}
  .stat b{display:block;font-size:23px;font-weight:700;margin-top:2px;letter-spacing:-.2px}
  .stat small{display:block;font-size:12px}
  .lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
  .bar{height:4px;border-radius:999px;background:var(--panel2);margin-top:5px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--grad);border-radius:inherit}
  .podio{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}
  .podio:empty{display:none}
  .pod{display:block;color:var(--text);text-decoration:none;transition:border-color .15s,transform .15s}
  .pod:hover{border-color:var(--accent);transform:translateY(-2px)}
  .pod:first-child{border-color:rgba(226,181,102,.55);background:linear-gradient(180deg,rgba(226,181,102,.09),var(--panel) 70%)}
  .rk{display:inline-block;font-size:12px;font-weight:700;color:#17110a;background:var(--muted);padding:1px 8px;border-radius:999px}
  .pod:nth-child(1) .rk{background:var(--grad)}
  .pod:nth-child(2) .rk{background:#b9bec9}
  .pod:nth-child(3) .rk{background:#c08457}
  .pod .ttl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0 6px;font-size:15px;font-weight:600}
  .pod b{display:block;font-size:22px;font-weight:700;margin:6px 0 2px}
  .pod small{display:block;font-size:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:clip;margin:8px 0 18px;box-shadow:var(--shadow)}
  table{width:100%;border-collapse:separate;border-spacing:0}
  th,td{padding:8px 10px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:0}
  th{position:sticky;top:0;z-index:1;background:#191620;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.9px;color:var(--muted)}
  th[data-k]{cursor:pointer}
  th[data-k]:hover{color:var(--text)}
  th.sorted{color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
  tbody tr:nth-child(even) td{background:rgba(255,255,255,.012)}
  tbody tr:hover td{background:rgba(226,181,102,.06)}
  .num{text-align:right;white-space:nowrap}
  .name{color:var(--text);font-weight:600;text-decoration:none}
  .name:hover{color:var(--accent)}
  .chip,.pill{display:inline-block;padding:2px 8px;border-radius:7px;font-size:12px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);text-decoration:none;white-space:nowrap}
  .pill{font-weight:600}
  .chip.pos,.pill.pos{color:var(--pos);background:var(--pos-soft);border-color:transparent}
  .chip.neg,.pill.neg{color:var(--neg);background:var(--neg-soft);border-color:transparent}
  .chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
  .chip.info{color:var(--info);background:var(--info-soft);border-color:transparent}
  td .chip{margin:2px 4px 2px 0}
  .lk{flex:none;padding:0 5px;border:1px solid var(--line);border-radius:999px;font-size:10px;line-height:15px;color:var(--muted);text-decoration:none;white-space:nowrap}
  .lk:hover,.lk:focus-visible{color:var(--text);border-color:var(--line2)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .comp{display:flex;overflow:hidden;height:14px;border-radius:999px;background:var(--panel2)}
  .comp > i{display:block;height:100%;flex:none}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;margin-top:10px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .off td:not(:nth-child(5)){opacity:.45}
  .note{margin:0 0 12px;padding:10px 12px;background:linear-gradient(90deg,var(--accent-soft),transparent 55%),var(--panel);border-left:3px solid var(--accent);border-radius:10px;color:#b9b2c4;line-height:1.55}
  .note:empty{display:none}
  .pos{color:var(--pos)}
  .neg{color:var(--neg)}
  .warn{color:var(--warn)}
  .err{color:var(--neg)}
  .muted,small{color:var(--muted)}
  td.pos,td.neg{font-weight:700}
  .ico{width:28px;height:28px;object-fit:contain;flex:none;vertical-align:middle;border-radius:4px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
  .ico.s{width:18px;height:18px}
  .ico.l{width:44px;height:44px}
  .ico.xl{width:64px;height:64px}
  .wi{display:inline-flex;align-items:center;gap:8px;min-width:0}
  /* calculator tables: the buttons drop under the name instead of pushing the last columns out of the card */
  .wi.wrap{flex-wrap:wrap;gap:2px 8px}
  /* some calculators have too many columns for a laptop screen: scroll sideways (their header stops being sticky) */
  #xtbl .card{overflow-x:auto}
  .num small{white-space:normal}  .hd{display:flex;align-items:center;gap:14px;margin:0 0 14px}
  .hd h2{margin:0;min-width:0}
  .pod .ico{float:right;margin:0 0 6px 10px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none!important}}
  @media (max-width:800px){
    body{display:block}
    h2{font-size:22px}
    .brand{margin-bottom:10px}
    aside{position:static;height:auto;width:auto;border-right:0;border-bottom:1px solid var(--line)}
    main{padding:16px;overflow-x:auto}
    .card{overflow-x:auto}
    /* sidebar compacta: Liga e Moeda lado a lado, navs em faixas de chips (senao o conteudo fica abaixo da dobra) */
    .side-ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}
    .side-ctl label{margin:0}
    #atualizar,#info{grid-column:1/-1}
    #info{margin:0}
    aside h4{margin:12px 10px 4px}
    nav{overflow-x:auto;white-space:nowrap}
    nav a{display:inline-flex;gap:6px;margin:0 6px 6px 0;padding:5px 10px;font-size:13px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);vertical-align:middle}
    nav a.on{box-shadow:none;border-color:var(--accent)}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .podio{grid-template-columns:minmax(0,1fr)}
  }
</style>
</head>
<body>
<aside>
  <a class="brand" href="#/top">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d48b"/><stop offset=".5" stop-color="#e2b566"/><stop offset="1" stop-color="#c8753a"/></linearGradient></defs><path d="M16 2 30 16 16 30 2 16Z" fill="none" stroke="url(#mk)" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 8 24 16 16 24 8 16Z" fill="url(#mk)"/><path d="M12 17.5 16 13.5 20 17.5" fill="none" stroke="#0b0a0f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Poe<b>CALC</b><small>Lucros de Path of Exile</small></span>
  </a>
  <div class="side-ctl">
    <label>Liga <select id="liga"></select></label>
    <label>Moeda <select id="moeda"><option value="c">Chaos</option><option value="div">Divine</option></select></label>
    <button id="atualizar" class="primary">Atualizar preços</button>
    <p class="muted" id="info"></p>
  </div>
  <nav id="nav"></nav>
  <nav id="extras"></nav>
</aside>
<main id="main"><p class="muted"><span class="spin"></span> Carregando...</p></main>
<script type="module">
import { calc, preFights, withPre } from './calc.js';

const STATIC = false; // build.mjs flips this to true in the GitHub Pages copy
const lgFile = (lg) => lg.replace(/[^a-zA-Z0-9]/g, '_');

const LEAGUES = ['Covens', 'Hardcore Covens', 'Standard', 'Hardcore'];
const mg = (c) => c.margin ?? -1e15;
const SORTS = {
  'Lucro maior': (a, b) => b.c.profit - a.c.profit,
  'Lucro menor': (a, b) => a.c.profit - b.c.profit,
  'Margem maior': (a, b) => mg(b.c) - mg(a.c),
  'Custo menor': (a, b) => a.c.cost - b.c.cost,
  'Valor esperado maior': (a, b) => b.c.ev - a.c.ev,
  'Mais runs': (a, b) => b.s.runs - a.s.runs,
  'Nome': (a, b) => (a.s.title || '').localeCompare(b.s.title || '', 'pt-BR'),
};
const $ = (q) => document.querySelector(q);
const main = $('#main');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
const nf = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const r1 = (n) => { const r = Math.round(n * 10) / 10; return nf.format(r === 0 ? 0 : r); };
const dec = (s) => { try { return decodeURIComponent(s); } catch { return s; } };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

let D = null;                                // resposta de /api/data
let liga = LEAGUES.includes(store.get('liga')) ? store.get('liga') : 'Covens';
let moeda = store.get('moeda') === 'div' ? 'div' : 'c';
let cur = null;                              // estrategia aberta no detalhe
let curCat = null;                           // categoria da lista
let ovCur = {};                              // ajustes da estrategia aberta
let lf = { q: '', sort: 'Lucro maior', pos: false, drop: false, unk: false };
let EXTRAS = [];                             // calculadoras extras (/api/extras)
let xv = {};                                 // calculadora aberta: slug, league, data, err, busy, sort, q, pos
let xTok = 0;                                // numero da ultima requisicao de calculadora

const money = (v) => {
  if (!Number.isFinite(v)) return '-';
  const dv = D?.live?.['divine-orb'];
  if (moeda === 'div' && dv > 0) return `${r1(v / dv)} div`;
  // under 1 c one decimal hides the whole number (vendor trades are worth cents)
  return `${v && Math.abs(v) < 1 ? v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : r1(v)} c`;
};
const pct = (v) => (Number.isFinite(v) ? `${r1(v)}%` : '-');
// custo desconhecido (costUnknown do calc.js): chip no lugar do custo; lucro vira "até" e sem cor
const costHtml = (c) => (c.costUnknown ? `<span class="chip warn">${c.req.length ? 'sem preço' : 'sem requisito'}</span>` : esc(money(c.cost)));
const profitTxt = (c) => (c.costUnknown ? `até ${money(c.profit)}` : money(c.profit));
const profitCls = (c) => (c.costUnknown ? 'muted' : c.profit > 0 ? 'pos' : c.profit < 0 ? 'neg' : '');
const unitHtml = (u) => (u > 0 ? esc(money(u)) : '<span class="chip warn">sem preço</span>');
const catName = (slug) => D.categories.find((c) => c.slug === slug)?.name ?? slug;
const wiki = (name) => `<a href="https://www.poewiki.net/wiki/${encodeURIComponent(name ?? '')}" target="_blank" rel="noopener">${esc(name)}</a>`;
// Mercado (busca no trade oficial da liga) e Wiki; sem liga, só Wiki (título da estratégia); sem nome, nada
const links = (name, league) => {
  if (!name) return '';
  const a = (href, title, txt) => `<a class="lk" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${title}">${txt}</a>`;
  const mk = league ? a(`https://www.pathofexile.com/trade/search/${encodeURIComponent(league)}?q=${encodeURIComponent(JSON.stringify({ query: { term: name } }))}`, 'Abrir no mercado oficial', 'Mercado') : '';
  return mk + a(`https://www.poewiki.net/index.php?search=${encodeURIComponent(name)}`, 'Abrir na wiki', 'Wiki');
};
const ico = (url, cls = '') => (url ? `<img class="ico ${cls}" src="${esc(url)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : '');
// arte da estratégia: imagem do poe.how redimensionada; sem ela, ícone do primeiro item
const simg = (s, w) => (s.img ? `https://poe.how/_next/image?url=${encodeURIComponent(/^(https?:|\/)/.test(s.img) ? s.img : '/' + s.img)}&w=${w}&q=75` :[...s.rew, ...s.req].map((l) => (D.icons ?? {})[l.item]).find(Boolean) ?? '');
const ovOf = (id) => { try { return { excluded: JSON.parse(store.get('ov:' + id))?.excluded || {} }; } catch { return { excluded: {} }; } };
function setOv(group, key, val) {
  const g = (ovCur[group] ??= {});
  if (val === undefined) delete g[key]; else g[key] = val;
  store.set('ov:' + cur.id, JSON.stringify(ovCur));
}

async function load(refresh) {
  const btn = $('#atualizar');
  btn.disabled = true;
  $('#info').textContent = 'Carregando...';
  try {
    const r = await fetch(STATIC ? `api/data-${lgFile(liga)}.json` : `/api/data?league=${encodeURIComponent(liga)}${refresh ? '&refresh=1' : ''}`);
    const j = await r.json().catch(() => ({})); // static copy: a missing file is an HTML 404
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    D = j;
    $('#nav').innerHTML = '<h4>Estratégias</h4><a href="#/top">Top lucros</a>' + D.categories.map((c) => `<a href="#/c/${encodeURIComponent(c.slug)}"><span class="wi">${ico(c.icon, 's')}${esc(c.name)}</span> <span class="cnt">${esc(c.count)}</span></a>`).join('');
    $('#info').innerHTML = `Preços: ${D.pricesAt ? esc(new Date(D.pricesAt).toLocaleString('pt-BR')) : '-'}<br>Drop rates: ${esc(new Date(D.syncedAt).toLocaleDateString('pt-BR'))}`;
    route();
  } catch (e) {
    $('#info').textContent = '';
    main.innerHTML = `<p class="err">Erro: ${esc(e.message)}</p>`;
  } finally {
    btn.disabled = false;
  }
}

function route() {
  if (!D) return;
  const hash = location.hash || '#/top';
  navOn();
  const [k, ...rest] = hash.replace(/^#\/?/, '').split('/');
  const arg = dec(rest.join('/'));
  if (k === 's') detail(arg);
  else if (k === 'x') extraView(arg);
  else listView(k === 'c' ? arg : null);
}

function listView(cat) {
  cur = null;
  curCat = cat;
  main.innerHTML = `
    <h2>${esc(cat ? catName(cat) : 'Top lucros')}</h2>
    <div id="sum" class="stats"></div>
    <div class="ctl">
      <label>Buscar <input id="q" type="search" placeholder="Buscar por título ou item..." value="${esc(lf.q)}"></label>
      <label>Ordenar <select id="sort">${Object.keys(SORTS).map((n) => `<option${n === lf.sort ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
      <label><input type="checkbox" id="pos"${lf.pos ? ' checked' : ''}> Só lucrativas</label>
      <label><input type="checkbox" id="drop"${lf.drop ? ' checked' : ''}> Só confiáveis (com drop e preços)</label>
      <label><input type="checkbox" id="unk"${lf.unk ? ' checked' : ''}> Mostrar custo desconhecido</label>
    </div>
    <div id="podio" class="podio"></div>
    <div id="tbl"></div>`;
  fillList();
}

function fillList() {
  lf = { q: $('#q').value, sort: $('#sort').value, pos: $('#pos').checked, drop: $('#drop').checked, unk: $('#unk').checked };
  const q = lf.q.trim().toLowerCase();
  const all = D.strategies.filter((s) => !curCat || s.category === curCat).map((s) => ({ s, c: calc(withPre(s, D.strategies), D.live, ovOf(s.id), D.counts) }));
  // lucro de custo desconhecido é só um teto: fica fora de tudo, salvo com o checkbox marcado
  const shown = all.filter((x) => lf.unk || !x.c.costUnknown), hidden = all.length - shown.length;
  const rows = shown
    .filter((x) => (!q || [x.s.title, ...x.s.req.map((l) => l.name), ...x.s.rew.map((l) => l.name)].some((t) => (t || '').toLowerCase().includes(q))) &&(!lf.pos || x.c.profit > 0) && (!lf.drop || (!x.c.noDropData && !x.c.noPrice)))
    .sort(SORTS[lf.sort]);
  const n = shown.length;
  const nPos = shown.filter((x) => x.c.profit > 0).length, share = n ? (nPos / n) * 100 : 0;
  const best = n ? Math.max(...shown.map((x) => x.c.profit)) : NaN;
  $('#sum').innerHTML = `<div class="stat"><span class="lbl">Estratégias</span><b>${esc(n)}</b>${hidden ? `<small>${hidden} ocultas (custo desconhecido)</small>` : ''}</div><div class="stat"><span class="lbl">Lucrativas</span><b>${esc(nPos)}</b><small>${esc(n ? `${pct(share)} do total` : '-')}</small><div class="bar"><i style="width:${share.toFixed(1)}%"></i></div></div><div class="stat"><span class="lbl">Lucro médio</span><b>${esc(money(n ? shown.reduce((a, x) => a + x.c.profit, 0) / n : NaN))}</b></div><div class="stat"><span class="lbl">Melhor lucro</span><b${best > 0 ? ' class="pos"' : ''}>${esc(money(best))}</b></div>`;
  $('#podio').innerHTML = rows.slice(0, 3).map((x, i) => podCard(x, i)).join('');
  $('#tbl').innerHTML = `<div class="card"><table><thead><tr><th class="num">#</th><th>Nome</th><th>Categoria</th><th class="num">Custo</th><th class="num">Esperado</th><th class="num">Lucro</th><th class="num">Margem %</th><th class="num">Runs</th><th class="num">Runs p/ 80%</th><th>Avisos</th></tr></thead><tbody>${rows.slice(0, 300).map((x, i) => rowHtml(x, i)).join('')}</tbody></table></div>${rows.length > 300 ? `<p class="muted">Mostrando 300 de ${rows.length}. Refine a busca.</p>` : ''}`;
}

function podCard({ s, c }, i) {
  const cls = profitCls(c);
  return `<a class="pod" href="#/s/${encodeURIComponent(s.id)}">${ico(simg(s, 128), 'l')}<span class="rk">#${i + 1}</span><span class="ttl">${esc(s.title)}</span><span class="chip">${esc(catName(s.category))}</span><b class="${cls}">${esc(profitTxt(c))}</b><small>Custo ${costHtml(c)} · Esperado ${esc(money(c.ev))} · Margem ${esc(c.costUnknown ? '-' : pct(c.margin))}</small></a>`;
}

function rowHtml({ s, c }, i) {
  const av = [];
  if (c.noDropData) av.push('sem dados de drop');
  if (c.noPrice > 0) av.push(`${c.noPrice} sem preço`);
  if (c.lowLiq > 0) av.push(`${c.lowLiq} com pouca liquidez`);
  if (!s.fixed && c.topShare > 0.7) av.push(`1 item = ${Math.round(c.topShare * 100)}% do valor`);
  if (c.snapshotPrices > 0) av.push(`${c.snapshotPrices} preços antigos`);
  const cls = profitCls(c);
  const mHtml = Number.isFinite(c.margin) && !c.costUnknown ? `<span class="pill${c.margin > 0 ? ' pos' : c.margin < 0 ? ' neg' : ''}">${esc(pct(c.margin))}</span>` : '-';
  return `<tr><td class="num muted">${i + 1}</td><td><span class="wi">${ico(simg(s, 64))}<a class="name" href="#/s/${encodeURIComponent(s.id)}">${esc(s.title)}</a></span></td><td><span class="chip">${esc(catName(s.category))}</span></td><td class="num">${costHtml(c)}</td><td class="num">${esc(money(c.ev))}</td><td class="num ${cls}">${esc(profitTxt(c))}</td><td class="num">${mHtml}</td><td class="num">${(s.runs || 0).toLocaleString('pt-BR')}<br><small>${esc(String(s.versions ?? '').replaceAll(',', ', '))}</small></td><td class="num">${c.costUnknown || c.runs80 == null ? '-' : c.runs80.toLocaleString('pt-BR')}</td><td>${av.map((w) => `<span class="chip warn">${esc(w)}</span>`).join('')}</td></tr>`;
}

function detail(id) {
  const raw = D.strategies.find((x) => String(x.id) === id);
  // convite: o custo já paga as lutas anteriores, então o loot delas entra junto
  const s = raw && withPre(raw, D.strategies);
  cur = s ?? null;
  if (!s) { main.innerHTML = '<p>Estratégia não encontrada.</p>'; return; }
  ovCur = ovOf(s.id);
  const c = calc(s, D.live, ovCur, D.counts);
  const pre = preFights(raw, D.strategies), paid = new Set(pre.flatMap((t) => t.req.map((l) => l.item)));
  const cyc = !pre.length ? '' : `
    <h3>Lutas do ciclo</h3>
    <p class="note">O custo deste convite é o das lutas que a Maven precisa testemunhar antes. O loot delas já está somado no valor esperado e no lucro acima.</p>
    <div class="card"><table><thead><tr><th>Luta</th><th class="num">Custo</th><th class="num">Valor esperado</th><th class="num">Runs</th></tr></thead><tbody>${pre.map((t) => `<tr><td><a class="name" href="#/s/${encodeURIComponent(t.id)}">${esc(t.title)}</a></td><td class="num">${esc(money(calc(t, D.live, {}, D.counts).cost))}</td><td class="num" data-f="${esc(t.title)}"></td><td class="num">${esc(t.runs)}</td></tr>`).join('')}${c.req.filter((l) => !paid.has(l.item)).map((l) => `<tr><td>${esc(l.name)} <span class="chip warn">sem dados de drop</span></td><td class="num">${unitHtml(l.total)}</td><td class="num">-</td><td class="num">-</td></tr>`).join('')}<tr><td>${esc(s.title)} (o convite)</td><td class="num">-</td><td class="num" data-f="${esc(s.title)}"></td><td class="num">${esc(s.runs)}</td></tr></tbody></table></div>`;
  const order = c.rew.map((_, i) => i).sort((a, b) => c.rew[b].expected - c.rew[a].expected);
  main.innerHTML = `
    <p><a class="chip" href="#/c/${encodeURIComponent(s.category)}">&larr; ${esc(catName(s.category))}</a></p>
    <div class="hd">${ico(simg(s, 128), 'xl')}<h2>${esc(s.title)}</h2>${links(s.title)}</div>
    <div class="meta">
      <span class="chip">Categoria: ${esc(catName(s.category))}</span>
      <span class="chip">Versões: ${esc(s.versions) || '-'}</span>
      <span class="chip">Runs: ${esc(s.runs)}</span>
      ${s.custom ? '' : `<span class="chip">Contribuidores: ${esc(s.contributors)}</span>
      <a class="chip" href="https://poe.how/economy/${encodeURIComponent(s.category)}/${encodeURIComponent(String(s.slug).toLowerCase().replace(/[^a-z0-9]+/g, '-'))}" target="_blank" rel="noopener">poe.how ↗</a>`}
    </div>
    <div class="stats">
      <div class="stat"><span class="lbl">Custo</span><b data-k="cost"></b></div>
      <div class="stat"><span class="lbl">Valor esperado</span><b data-k="ev"></b></div>
      <div class="stat"><span class="lbl">Lucro</span><b data-k="profit"></b></div>
      <div class="stat"><span class="lbl">Margem</span><b data-k="margin"></b></div>
      <div class="stat"><span class="lbl">Runs p/ 80%</span><b data-k="runs80"></b></div>
    </div>
    <p class="note" id="unk"></p>${s.note ? `<p class="note">${esc(s.note)}</p>` : ''}${cyc}
    <h3>Composição do valor esperado</h3>
    <div id="comp"></div>
    <h3>Requisitos</h3>
    <div class="card"><table><thead><tr><th>Item</th><th class="num">Qtd</th><th class="num">Preço unit.</th><th class="num">Total</th><th>Fonte</th></tr></thead><tbody>${s.req.map((l, i) => `<tr data-r="${i}"><td><span class="wi">${ico((D.icons ?? {})[l.item])}${wiki(l.name)}${links(l.name, liga)}</span></td><td class="num">${esc(l.amount)}</td><td class="num">${unitHtml(c.req[i].unit)}</td><td class="num" data-k="total"></td><td data-k="src"></td></tr>`).join('')}</tbody></table></div>
    <h3>Recompensas</h3>
    <div class="card"><table><thead><tr><th>Item</th><th class="num">Qtd</th><th class="num">Preço unit.</th><th class="num">Anúncios</th><th class="num">Drop %</th><th>Excluir</th><th class="num">Valor esperado</th><th>Grupo</th><th>Fonte</th></tr></thead><tbody>${order.map((i) => { const l = s.rew[i], n = c.rew[i].count; return `<tr data-w="${i}"><td><span class="wi">${ico((D.icons ?? {})[l.item])}${wiki(l.name)}${links(l.name, liga)}${l.from && l.from !== s.title ? `<span class="chip">${esc(l.from)}</span>` : ''}</span></td><td class="num">${esc(l.amount)}</td><td class="num">${unitHtml(c.rew[i].unit)}</td><td class="num${n < 10 ? ' warn' : ''}">${n == null ? '-' : n.toLocaleString('pt-BR')}</td><td class="num">${esc(pct(l.rate * 100))}</td><td><input type="checkbox" data-kind="excl" data-idx="${i}"></td><td class="num"><span data-k="expected"></span><div class="bar"><i data-k="bar"></i></div></td><td>${esc(l.group ?? '-')}</td><td data-k="src"></td></tr>`; }).join('')}</tbody></table></div>
    <p><button id="reset">Limpar exclusões</button></p>`;
  updateDetail();
}

const COMP = ['#e2b566', '#a892ff', '#5fd39a', '#6ac5e8', '#e5744b']; // cores das 5 maiores fatias
const SRC = { live: ['ao vivo', 'pos'], snapshot: ['antigo', 'warn'] };
const srcBadge = (s) => (Object.hasOwn(SRC, s) ? `<span class="chip ${SRC[s][1]}">${SRC[s][0]}</span>` : esc(s ?? '-'));
// barra empilhada do valor esperado: 5 maiores + "Outros"
function compHtml(rew, tot) {
  if (!(tot > 0)) return '<p class="muted">Sem valor esperado.</p>';
  const parts = rew.filter((l) => !l.excluded && l.expected > 0).sort((a, b) => b.expected - a.expected);
  const segs = parts.slice(0, 5).map((l, i) => ({ name: l.from && l.from !== cur.title ? `${l.name} (${l.from})` : l.name, v: l.expected, color: COMP[i] }));
  const rest = parts.slice(5).reduce((a, l) => a + l.expected, 0);
  if (rest > 0) segs.push({ name: 'Outros', v: rest, color: '#4d4760' });
  const sh = segs.map((g) => ({ ...g, p: (g.v / tot) * 100 }));
  return `<div class="comp">${sh.map((g) => `<i style="width:${g.p.toFixed(2)}%;background:${g.color}" title="${esc(`${g.name}: ${pct(g.p)}`)}"></i>`).join('')}</div>`
    + `<div class="legend">${sh.map((g) => `<span><span class="dot" style="background:${g.color}"></span>${esc(g.name)} <small>${esc(pct(g.p))}</small></span>`).join('')}</div>`;
}
// updates text in place (the tables are not rebuilt)
function updateDetail() {
  const c = calc(cur, D.live, ovCur, D.counts);
  const top = { ev: money(c.ev), profit: profitTxt(c), margin: c.costUnknown ? '-' : pct(c.margin), runs80: c.costUnknown || c.runs80 == null ? '-' : c.runs80.toLocaleString('pt-BR') };
  main.querySelector('b[data-k="cost"]').innerHTML = costHtml(c);
  for (const k in top) main.querySelector(`b[data-k="${k}"]`).textContent = top[k];
  main.querySelector('b[data-k="profit"]').className = profitCls(c);
  const unk = c.req.length
    ? 'O custo desta estratégia é desconhecido: não há preço para um ou mais itens de entrada nesta liga (nem no poe.how, nem no poe.ninja ou poe.watch). O lucro mostrado é o máximo possível, sem descontar esses itens.'
    : 'O poe.how não cadastrou os itens de entrada desta estratégia, então o custo é desconhecido. O lucro mostrado é o valor esperado inteiro, sem descontar o custo.';
  main.querySelector('#unk').textContent = c.costUnknown ? unk : '';
  const tot = c.rew.reduce((a, l) => a + (l.excluded || !(l.expected > 0) ? 0 : l.expected), 0);
  main.querySelector('#comp').innerHTML = compHtml(c.rew, tot);
  main.querySelectorAll('td[data-f]').forEach((td) => { td.textContent = money(c.rew.reduce((a, l) => a + (l.from === td.dataset.f ? l.expected : 0), 0)); });
  main.querySelectorAll('tr[data-r]').forEach((tr) => {
    const l = c.req[+tr.dataset.r];
    tr.querySelector('[data-k="total"]').textContent = l.unit > 0 ? money(l.total) : '-';
    tr.querySelector('[data-k="src"]').innerHTML = srcBadge(l.source);
  });
  main.querySelectorAll('tr[data-w]').forEach((tr) => {
    const l = c.rew[+tr.dataset.w];
    tr.querySelector('[data-k="expected"]').textContent = money(l.expected);
    tr.querySelector('[data-k="bar"]').style.width = `${!l.excluded && l.expected > 0 && tot > 0 ? (l.expected / tot) * 100 : 0}%`;
    tr.querySelector('[data-k="src"]').innerHTML = srcBadge(l.source);
    tr.querySelector('input[data-kind="excl"]').checked = l.excluded;
    tr.classList.toggle('off', !!l.excluded);
  });
}

// calculadoras extras (extras/<slug>.mjs): uma tabela generica para qualquer uma delas
function navOn() {
  document.querySelectorAll('#nav a, #extras a').forEach((a) => a.classList.toggle('on', a.getAttribute('href') === (location.hash || '#/top')));
}

function extraView(slug) {
  cur = null;
  if (xv.slug !== slug) xv = { slug, sort: null, q: '', pos: false, data: null, err: null, busy: false, league: null };
  main.innerHTML = `
    <h2 id="xh"></h2>
    <p class="note" id="xn"></p>
    <p class="muted"><span id="xs"></span> <button id="xref">Atualizar</button> <span class="err" id="xe"></span></p>
    <div class="ctl">
      <label>Buscar <input id="xq" type="search" placeholder="Buscar..."></label>
      <label id="xpl" hidden><input type="checkbox" id="xpos"> Só lucrativas</label>
    </div>
    <p class="muted" id="xcount"></p>
    <div id="xtbl"></div>`;
  $('#xq').value = xv.q;
  $('#xpos').checked = xv.pos;
  $('#xq').addEventListener('input', (e) => { xv.q = e.target.value; renderExtraTable(); });
  $('#xpos').addEventListener('change', (e) => { xv.pos = e.target.checked; renderExtraTable(); });
  $('#xref').addEventListener('click', () => loadExtra(true));
  $('#xtbl').addEventListener('click', (e) => {
    const th = e.target.closest('th[data-k]');
    if (!th) return;
    const k = th.dataset.k;
    if (xv.sort?.key === k) xv.sort = { key: k, dir: xv.sort.dir === 'asc' ? 'desc' : 'asc' };
    else xv.sort = { key: k, dir: xv.data.columns.find((c) => c.key === k).type === 'text' ? 'asc' : 'desc' };
    renderExtraTable();
  });
  if (xv.league !== liga || (!xv.busy && !xv.data)) loadExtra(false);
  else updateExtra();
}

async function loadExtra(refresh) {
  const tok = ++xTok, slug = xv.slug, lg = liga;
  if (xv.league !== lg) xv.data = null;
  Object.assign(xv, { league: lg, busy: true, err: null });
  updateExtra();
  try {
    const r = await fetch(STATIC ? `api/extra-${slug}-${lgFile(lg)}.json` : `/api/extra/${encodeURIComponent(slug)}?league=${encodeURIComponent(lg)}${refresh ? '&refresh=1' : ''}`);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || (r.status === 404 ? 'Sem dados para esta liga' : `HTTP ${r.status}`));
    if (tok === xTok) { xv.data = j; xv.sort ??= j.defaultSort; }
  } catch (e) {
    if (tok === xTok) xv.err = e.message;
  } finally {
    // resposta de outra liga/calculadora e descartada; so repinta se a view ainda estiver na tela
    if (tok === xTok) { xv.busy = false; if ($('#xtbl')) updateExtra(); }
  }
}

function updateExtra() {
  const d = xv.data;
  $('#xh').textContent = d?.title ?? EXTRAS.find((x) => x.slug === xv.slug)?.title ?? xv.slug;
  $('#xn').textContent = d?.note ?? '';
  $('#xs').innerHTML = xv.busy ? '<span class="spin"></span> Carregando... (pode levar até um minuto)' : esc(d ? `Atualizado: ${new Date(d.at).toLocaleString('pt-BR')}${d.stale ? ' (dados antigos)' : ''}` : '');
  $('#xref').disabled = xv.busy;
  $('#xe').textContent = xv.err ? `Erro: ${xv.err}` : '';
  $('#xpl').hidden = !d?.columns.some((c) => c.key === 'profit');
  renderExtraTable();
}

// so o contador e a tabela sao refeitos aqui, assim a caixa de busca nao perde o foco ao digitar
function renderExtraTable() {
  const d = xv.data;
  if (!d) { $('#xcount').textContent = ''; $('#xtbl').innerHTML = ''; return; }
  const q = xv.q.trim().toLowerCase(), textKeys = d.columns.filter((c) => c.type === 'text').map((c) => c.key);
  const rows = d.rows.filter((r) => (!q || textKeys.some((k) => String(r[k] ?? '').toLowerCase().includes(q))) && (!xv.pos || r.profit > 0));
  const { key, dir } = xv.sort ?? d.defaultSort ?? {};
  const sgn = dir === 'asc' ? 1 : -1;
  rows.sort((a, b) => {
    const x = a[key], y = b[key];
    if (x == null || y == null) return (x == null) - (y == null); // vazios sempre no fim
    return sgn * (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'pt-BR'));
  });
  const shown = rows.slice(0, 500);
  $('#xcount').textContent = `Total: ${d.rows.length}` + (rows.length < d.rows.length ? ` · Com o filtro: ${rows.length}` : '') + (shown.length < rows.length ? ` · Mostrando ${shown.length} de ${rows.length}` : '');
  const head = d.columns.map((c) => `<th class="${c.type === 'text' ? '' : 'num'}${c.key === key ? ' sorted' : ''}" data-k="${esc(c.key)}">${esc(c.label)}${c.key === key ? (dir === 'asc' ? ' ▲' : ' ▼') : ''}</th>`).join('');
  const iconKey = d.columns.find((c) => c.type === 'text')?.key; // o ícone da linha vai antes da 1ª coluna de texto
  // Mercado/Wiki só quando essa coluna é nome de item ou gema (name, base); colour e effect (notável) não têm
  const lkKey = ['name', 'base'].includes(iconKey) ? iconKey : null;
  const body = shown.map((r) => `<tr>${d.columns.map((c) => {
    const lk = c.key === lkKey ? links(r[c.key], xv.league) : '';
    return `<td class="${xcls(c, r)}">${c.key === iconKey && (r.icon || lk) ? `<span class="wi">${ico(r.icon)}<span class="wi wrap">${xfmt(c, r[c.key])}${lk}</span></span>` : xfmt(c, r[c.key])}</td>`;
  }).join('')}</tr>`).join('');
  $('#xtbl').innerHTML = `<div class="card"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function xcls(c, r) {
  return (c.type === 'text' ? '' : 'num') + (c.type === 'chaos' && c.key === 'profit' ? (r.profit > 0 ? ' pos' : r.profit < 0 ? ' neg' : '') : '');
}

function xfmt(c, v) {
  if (v == null) return '-';
  if (c.type === 'chaos') return esc(money(v));
  if (c.type === 'text') return esc(v);
  if (!Number.isFinite(v)) return '-';
  if (c.type === 'int') return (Math.round(v) || 0).toLocaleString('pt-BR');
  if (c.type === 'pct') return `${r1(v)}%`;
  return r1(v);
}

function onEdit(e) {
  const t = e.target;
  if (['q', 'sort', 'pos', 'drop', 'unk'].includes(t.id)) return fillList();
  const kind = t.dataset.kind;
  if (!cur || !kind) return;
  if (kind === 'excl') setOv('excluded', t.dataset.idx, t.checked ? true : undefined);
  updateDetail();
}

function onClick(e) {
  if (e.target.id === 'reset' && cur) { store.del('ov:' + cur.id); detail(String(cur.id)); }
}

main.addEventListener('input', onEdit);
main.addEventListener('change', onEdit);
main.addEventListener('click', onClick);
window.addEventListener('hashchange', route);

const $liga = $('#liga'), $moeda = $('#moeda');
$liga.innerHTML = LEAGUES.map((l) => `<option>${l}</option>`).join('');
$liga.value = liga;
$moeda.value = moeda;
$liga.addEventListener('change', () => { liga = $liga.value; store.set('liga', liga); load(false); });
$moeda.addEventListener('change', () => { moeda = $moeda.value; store.set('moeda', moeda); route(); });
$('#atualizar').addEventListener('click', () => load(true));
fetch(STATIC ? 'api/extras.json' : '/api/extras').then((r) => (r.ok ? r.json() : [])).then((list) => {
  EXTRAS = list;
  $('#extras').innerHTML = list.length ? `<h4>Calculadoras</h4>${list.map((x) => `<a href="#/x/${encodeURIComponent(x.slug)}">${esc(x.title)}</a>`).join('')}` : '';
  navOn();
}).catch(() => {});
load(false);
</script>
</body>
</html>
