<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f3d48b'/%3E%3Cstop offset='.5' stop-color='%23e2b566'/%3E%3Cstop offset='1' stop-color='%23c8753a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%230b0a0f'/%3E%3Cpath d='M16 3 29 16 16 29 3 16Z' fill='none' stroke='url(%23g)' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M16 8.5 23.5 16 16 23.5 8.5 16Z' fill='url(%23g)'/%3E%3Cpath d='M12 17.5 16 13.5 20 17.5' fill='none' stroke='%230b0a0f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>PoeCALC · Entrar</title>
<style>
  :root {
    --bg:#0b0a0f; --panel:#141219; --panel2:#1c1924; --line:#2b2736; --line2:#3d3750;
    --text:#ece7dd; --muted:#948da3;
    --accent:#e2b566;
    --grad:linear-gradient(135deg,#f3d48b 0%,#e2b566 45%,#c8753a 100%);
    --neg:#ff6b78;
    --r:12px;
    --display:"Cinzel",Georgia,"Times New Roman",serif;
    --shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 28px -16px rgba(0,0,0,.7);
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  body{margin:0;padding:16px;min-height:100vh;display:flex;align-items:center;justify-content:center;font:14px/1.5 "Inter",system-ui,"Segoe UI",sans-serif;background:radial-gradient(900px 520px at 0% 0%,rgba(200,117,58,.11),transparent 62%),radial-gradient(820px 600px at 100% 0%,rgba(168,146,255,.07),transparent 62%),var(--bg);background-attachment:fixed;color:var(--text)}
  .card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:11px;margin:0 0 22px;font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:1.2px;line-height:1.1;color:var(--text)}
  .brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{display:block;margin-top:4px;font:500 10px/1.2 "Inter",system-ui,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
  .brand .mark{width:34px;height:34px;flex:none;filter:drop-shadow(0 0 10px rgba(226,181,102,.35))}
  label{display:block;margin:0 0 14px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
  input{display:block;width:100%;margin-top:6px;padding:9px 11px;font:inherit;font-size:15px;letter-spacing:0;text-transform:none;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px}
  input:hover{border-color:var(--line2)}
  button{width:100%;margin-top:6px;padding:9px 10px;font:inherit;font-weight:700;color:#17110a;background:var(--grad);border:1px solid transparent;border-radius:9px;cursor:pointer;box-shadow:0 6px 18px -8px rgba(226,181,102,.6)}
  button:hover:not(:disabled){filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:default}
  #erro{min-height:1.5em;margin:4px 0 0;font-size:13px;color:var(--neg)}
</style>
</head>
<body>
<main class="card">
  <h1 class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d48b"/><stop offset=".5" stop-color="#e2b566"/><stop offset="1" stop-color="#c8753a"/></linearGradient></defs><path d="M16 2 30 16 16 30 2 16Z" fill="none" stroke="url(#mk)" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 8 24 16 16 24 8 16Z" fill="url(#mk)"/><path d="M12 17.5 16 13.5 20 17.5" fill="none" stroke="#0b0a0f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Poe<b>CALC</b><small>Lucros de Path of Exile</small></span>
  </h1>
  <form id="f">
    <label>Usuário <input name="user" autocomplete="username" required autofocus></label>
    <label>Senha <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" id="entrar">Entrar</button>
    <p id="erro" role="alert"></p>
  </form>
</main>
<script>
const form = document.querySelector('#f'), erro = document.querySelector('#erro'), entrar = document.querySelector('#entrar');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  erro.textContent = '';
  entrar.disabled = true;
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ user: form.user.value, password: form.password.value }) });
    if (r.ok) return (location.href = '/');
    erro.textContent = (await r.json().catch(() => ({}))).error || `Erro ${r.status}`;
  } catch {
    erro.textContent = 'Sem conexão com o servidor.';
  }
  entrar.disabled = false;
});
</script>
</body>
</html>
